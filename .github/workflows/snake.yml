name: Contribution Snake

on:
  schedule:
    # every day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the generator
        run: |
          curl -fsSL -o engine.js   https://roninimous.github.io/github-snake/engine.js
          curl -fsSL -o generate.js https://roninimous.github.io/github-snake/readme/generate.js

      - name: Play the snake
        run: node generate.js --user "${{ github.repository_owner }}" --out . --step 0.14

      - name: Commit the result
        run: |
          rm -f engine.js generate.js
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake-dark.svg snake-light.svg
          git diff --staged --quiet || git commit -m "Update contribution snake"
          git push
